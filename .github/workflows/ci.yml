name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dirty30
          POSTGRES_PASSWORD: dirty30
          POSTGRES_DB: dirty30_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dirty30 -d dirty30_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://dirty30:dirty30@localhost:5432/dirty30_app
      TEST_DATABASE_URL: postgresql://dirty30:dirty30@localhost:5432/dirty30_test
      CLERK_SECRET_KEY: test_clerk_secret
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      BOOTSTRAP_COMMISSIONER_PHONE: "+12025550100"
      APP_ORIGIN: https://staging.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
