openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Dirty-30 league management API
servers:
  - url: /api
tags:
  - name: health
  - name: dashboard
  - name: teams
  - name: schedule
  - name: standings
  - name: scores
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get role-aware dashboard summary
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /me:
    get:
      operationId: getCurrentUser
      tags: [profile]
      responses:
        "200":
          description: Current authenticated user
          content: { application/json: { schema: { $ref: "#/components/schemas/UserProfile" } } }
    patch:
      operationId: updateCurrentUser
      tags: [profile]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfileInput" } } }
      responses:
        "200":
          description: Updated user
          content: { application/json: { schema: { $ref: "#/components/schemas/UserProfile" } } }
  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List league teams
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
  /teams/{teamId}:
    get:
      operationId: getTeam
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    patch:
      operationId: updateTeam
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
  /teams/{teamId}/roster:
    get:
      operationId: getTeamRoster
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
  /teams/{teamId}/captain:
    patch:
      operationId: assignTeamCaptain
      tags: [teams]
      parameters: [ { $ref: "#/components/parameters/TeamId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CaptainInput" } } }
      responses: { "204": { description: Captain assigned } }
  /teams/{teamId}/active:
    patch:
      operationId: setTeamActive
      tags: [teams]
      parameters: [ { $ref: "#/components/parameters/TeamId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ActiveInput" } } }
      responses:
        "200":
          description: Team updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
  /teams/{teamId}/invitations:
    post:
      operationId: createInvitation
      tags: [teams]
      parameters: [ { $ref: "#/components/parameters/TeamId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InvitationInput" } } }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationResult" }
  /teams/{teamId}/invitations/{invitationId}:
    delete:
      operationId: cancelInvitation
      tags: [teams]
      parameters: [ { $ref: "#/components/parameters/TeamId" }, { $ref: "#/components/parameters/InvitationId" } ]
      responses: { "204": { description: Invitation cancelled } }
  /teams/{teamId}/invitations/{invitationId}/regenerate:
    post:
      operationId: regenerateInvitation
      tags: [teams]
      parameters: [ { $ref: "#/components/parameters/TeamId" }, { $ref: "#/components/parameters/InvitationId" } ]
      responses:
        "200":
          description: New invitation link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationResult" }
  /teams/{teamId}/players/{userId}:
    delete:
      operationId: removeTeamPlayer
      tags: [teams]
      parameters: [ { $ref: "#/components/parameters/TeamId" }, { $ref: "#/components/parameters/UserId" } ]
      responses: { "204": { description: Player removed } }
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [teams]
      parameters: [ { $ref: "#/components/parameters/InvitationToken" } ]
      responses: { "204": { description: Invitation accepted } }
  /schedule:
    get:
      operationId: listGames
      tags: [schedule]
      parameters:
        - name: teamId
          in: query
          schema: { type: integer }
        - name: date
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createGame
      tags: [schedule]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GameInput" } } }
      responses:
        "201":
          description: Draft game created
          content: { application/json: { schema: { $ref: "#/components/schemas/Game" } } }
  /schedule/{gameId}:
    get:
      operationId: getGame
      tags: [schedule]
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
    patch:
      operationId: updateGame
      tags: [schedule]
      parameters: [ { $ref: "#/components/parameters/GameId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GameInput" } } }
      responses:
        "200":
          description: Game updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Game" } } }
  /schedule/{gameId}/publish:
    post:
      operationId: publishGame
      tags: [schedule]
      parameters: [ { $ref: "#/components/parameters/GameId" } ]
      responses: { "204": { description: Game published } }
  /schedule/{gameId}/cancel:
    post:
      operationId: cancelGame
      tags: [schedule]
      parameters: [ { $ref: "#/components/parameters/GameId" } ]
      responses: { "204": { description: Game cancelled } }
  /venues:
    get:
      operationId: listVenues
      tags: [schedule]
      responses:
        "200":
          description: Venues
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Venue" } }
    post:
      operationId: createVenue
      tags: [schedule]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VenueInput" } } }
      responses:
        "201":
          description: Venue created
          content: { application/json: { schema: { $ref: "#/components/schemas/Venue" } } }
  /venues/{venueId}:
    patch:
      operationId: updateVenue
      tags: [schedule]
      parameters: [ { $ref: "#/components/parameters/VenueId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VenueUpdate" } } }
      responses:
        "200":
          description: Venue updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Venue" } } }
  /venues/{venueId}/courts:
    get:
      operationId: listCourts
      tags: [schedule]
      parameters: [ { $ref: "#/components/parameters/VenueId" } ]
      responses:
        "200":
          description: Courts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Court" } }
    post:
      operationId: createCourt
      tags: [schedule]
      parameters: [ { $ref: "#/components/parameters/VenueId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CourtInput" } } }
      responses:
        "201":
          description: Court created
          content: { application/json: { schema: { $ref: "#/components/schemas/Court" } } }
  /courts/{courtId}:
    patch:
      operationId: updateCourt
      tags: [schedule]
      parameters: [ { $ref: "#/components/parameters/CourtId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CourtUpdate" } } }
      responses:
        "200":
          description: Court updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Court" } } }
  /standings:
    get:
      operationId: getStandings
      tags: [standings]
      responses:
        "200":
          description: Standings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Standing"
  /scores/{gameId}:
    post:
      operationId: submitScore
      tags: [scores]
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreInput"
      responses:
        "200":
          description: Score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Score"
    patch:
      operationId: correctScore
      tags: [scores]
      parameters: [ { $ref: "#/components/parameters/GameId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScoreInput" } } }
      responses: { "204": { description: Score entered or corrected } }
  /scores/review:
    get:
      operationId: getScoreReviewQueue
      tags: [scores]
      responses:
        "200":
          description: Scores needing commissioner attention
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
  /scores/{gameId}/confirm:
    post:
      operationId: confirmScore
      tags: [scores]
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "204":
          description: Score finalized
  /scores/{gameId}/dispute:
    post:
      operationId: disputeScore
      tags: [scores]
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeInput"
      responses:
        "204":
          description: Score disputed
  /scores/{gameId}/resolve:
    post:
      operationId: resolveScore
      tags: [scores]
      parameters: [ { $ref: "#/components/parameters/GameId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScoreInput" } } }
      responses: { "204": { description: Disputed score resolved } }
components:
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: integer }
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: integer }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: integer }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer }
    VenueId:
      name: venueId
      in: path
      required: true
      schema: { type: integer }
    CourtId:
      name: courtId
      in: path
      required: true
      schema: { type: integer }
    InvitationToken:
      name: token
      in: path
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Dashboard:
      type: object
      required: [leagueName, seasonName, role, nextGame, attentionItems, recentResults]
      properties:
        leagueName: { type: string }
        seasonName: { type: string }
        role: { type: string, enum: [COMMISSIONER, CAPTAIN, PLAYER] }
        nextGame:
          anyOf:
            - $ref: "#/components/schemas/Game"
            - type: "null"
        attentionItems:
          type: array
          items: { type: string }
        recentResults:
          type: array
          items:
            $ref: "#/components/schemas/Game"
    UserProfile:
      type: object
      required: [id, firstName, lastName, phone, role]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string, pattern: '^\+[1-9]\d{1,14}$' }
        role: { type: string, enum: [COMMISSIONER, CAPTAIN, PLAYER] }
    ProfileInput:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
    CaptainInput:
      type: object
      required: [userId]
      properties: { userId: { type: integer } }
    ActiveInput:
      type: object
      required: [active]
      properties: { active: { type: boolean } }
    InvitationInput:
      type: object
      required: [phone]
      properties: { phone: { type: string, pattern: '^\+[1-9]\d{1,14}$' } }
    InvitationResult:
      type: object
      required: [id, expiresAt, token]
      properties:
        id: { type: integer }
        expiresAt: { type: string, format: date-time }
        token: { type: string }
    Team:
      type: object
      required: [id, name, captainName, playerCount, active]
      properties:
        id: { type: integer }
        name: { type: string }
        captainName: { type: string }
        playerCount: { type: integer }
        active: { type: boolean }
    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        captainId: { type: ["integer", "null"] }
    TeamUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        captainId: { type: ["integer", "null"] }
        active: { type: boolean }
    Venue:
      type: object
      required: [id, leagueId, name, address, active]
      properties:
        id: { type: integer }
        leagueId: { type: integer }
        name: { type: string }
        address: { type: string }
        active: { type: boolean }
    VenueInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string }
    VenueUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string }
        active: { type: boolean }
    Court:
      type: object
      required: [id, venueId, name, active]
      properties:
        id: { type: integer }
        venueId: { type: integer }
        name: { type: string }
        active: { type: boolean }
    CourtInput:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1 } }
    CourtUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        active: { type: boolean }
    GameInput:
      type: object
      required: [homeTeamId, awayTeamId, venueId, courtId, scheduledAt]
      properties:
        homeTeamId: { type: integer }
        awayTeamId: { type: integer }
        venueId: { type: integer }
        courtId: { type: integer }
        scheduledAt: { type: string, format: date-time }
    Player:
      type: object
      required: [id, firstName, lastName, status]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string, pattern: '^\+[1-9]\d{1,14}$' }
        status: { type: string, enum: [ACTIVE, PENDING] }
    Game:
      type: object
      required: [id, date, startTime, venue, court, homeTeam, awayTeam, status, published]
      properties:
        id: { type: integer }
        date: { type: string }
        startTime: { type: string }
        venue: { type: string }
        court: { type: string }
        homeTeam: { type: string }
        awayTeam: { type: string }
        homeTeamId: { type: integer }
        awayTeamId: { type: integer }
        status: { type: string, enum: [SCHEDULED, CANCELLED, FINAL, PENDING_CONFIRMATION, DISPUTED] }
        published: { type: boolean }
        homeScore: { type: ["integer", "null"] }
        awayScore: { type: ["integer", "null"] }
    ScoreInput:
      type: object
      required: [homeScore, awayScore]
      properties:
        homeScore: { type: integer, minimum: 0 }
        awayScore: { type: integer, minimum: 0 }
    Score:
      type: object
      required: [gameId, homeScore, awayScore, status]
      properties:
        gameId: { type: integer }
        homeScore: { type: integer }
        awayScore: { type: integer }
        status: { type: string, enum: [NOT_SUBMITTED, PENDING_CONFIRMATION, DISPUTED, FINAL] }
    DisputeInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
    Standing:
      type: object
      required: [rank, teamName, played, wins, losses, pointsFor, pointsAgainst, differential]
      properties:
        rank: { type: integer }
        teamName: { type: string }
        played: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        pointsFor: { type: integer }
        pointsAgainst: { type: integer }
        differential: { type: integer }