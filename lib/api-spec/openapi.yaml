openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Dirty-30 league management API
servers:
  - url: /api
tags:
  - name: health
  - name: dashboard
  - name: teams
  - name: schedule
  - name: standings
  - name: scores
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get role-aware dashboard summary
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /league-initialization:
    get:
      operationId: getLeagueInitializationStatus
      tags: [dashboard]
      summary: Check whether the active commissioner must initialize the league
      responses:
        "200":
          description: League initialization status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueInitializationStatus"
    post:
      operationId: initializeLeague
      tags: [dashboard]
      summary: Create the first active league and season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeagueInitializationInput"
      responses:
        "201":
          description: League initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueInitializationResult"
        "409":
          description: An active league and season already exist
  /me:
    get:
      operationId: getCurrentUser
      tags: [profile]
      responses:
        "200":
          description: Current authenticated user
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/UserProfile" } },
            }
    patch:
      operationId: updateCurrentUser
      tags: [profile]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ProfileInput" } },
          }
      responses:
        "200":
          description: Updated user
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/UserProfile" } },
            }
  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List league teams
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
  /teams/{teamId}:
    get:
      operationId: getTeam
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    patch:
      operationId: updateTeam
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
  /teams/{teamId}/roster:
    get:
      operationId: getTeamRoster
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
  /teams/{teamId}/captain:
    patch:
      operationId: assignTeamCaptain
      tags: [teams]
      parameters: [{ $ref: "#/components/parameters/TeamId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/CaptainInput" } },
          }
      responses: { "204": { description: Captain assigned } }
  /teams/{teamId}/active:
    patch:
      operationId: setTeamActive
      tags: [teams]
      parameters: [{ $ref: "#/components/parameters/TeamId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ActiveInput" } },
          }
      responses:
        "200":
          description: Team updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
  /teams/{teamId}/invitations:
    post:
      operationId: createInvitation
      tags: [teams]
      parameters: [{ $ref: "#/components/parameters/TeamId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/InvitationInput" } },
          }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationResult" }
  /teams/{teamId}/invitations/{invitationId}:
    delete:
      operationId: cancelInvitation
      tags: [teams]
      parameters:
        [
          { $ref: "#/components/parameters/TeamId" },
          { $ref: "#/components/parameters/InvitationId" },
        ]
      responses: { "204": { description: Invitation cancelled } }
  /teams/{teamId}/invitations/{invitationId}/regenerate:
    post:
      operationId: regenerateInvitation
      tags: [teams]
      parameters:
        [
          { $ref: "#/components/parameters/TeamId" },
          { $ref: "#/components/parameters/InvitationId" },
        ]
      responses:
        "200":
          description: New invitation link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationResult" }
  /teams/{teamId}/players/{userId}:
    delete:
      operationId: removeTeamPlayer
      tags: [teams]
      parameters:
        [
          { $ref: "#/components/parameters/TeamId" },
          { $ref: "#/components/parameters/UserId" },
        ]
      responses: { "204": { description: Player removed } }
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [teams]
      parameters: [{ $ref: "#/components/parameters/InvitationToken" }]
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                type: object
                required: [teamId]
                properties: { teamId: { type: integer } }
  /invitations/{token}:
    get:
      operationId: getInvitation
      tags: [teams]
      parameters: [{ $ref: "#/components/parameters/InvitationToken" }]
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationDetails" }
  /schedule:
    get:
      operationId: listGames
      tags: [schedule]
      parameters:
        - name: teamId
          in: query
          schema: { type: integer }
        - name: date
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createGame
      tags: [schedule]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/GameInput" } },
          }
      responses:
        "201":
          description: Draft game created
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Game" } },
            }
  /schedule/{gameId}:
    get:
      operationId: getGame
      tags: [schedule]
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
    patch:
      operationId: updateGame
      tags: [schedule]
      parameters: [{ $ref: "#/components/parameters/GameId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/GameInput" } },
          }
      responses:
        "200":
          description: Game updated
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Game" } },
            }
  /schedule/generator/preview:
    post:
      operationId: previewScheduleGenerator
      tags: [schedule]
      summary: Preview a deterministic draft schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleGeneratorInput"
      responses:
        "200":
          description: Schedule preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleGeneratorPreview"
        "409":
          description: Schedule capacity or conflict error
  /schedule/generator/commit:
    post:
      operationId: commitScheduleGenerator
      tags: [schedule]
      summary: Create a generated schedule as unpublished drafts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleGeneratorCommitInput"
      responses:
        "201":
          description: Draft schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleGeneratorCommitResult"
        "200":
          description: Identical schedule already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleGeneratorCommitResult"
        "409":
          description: Schedule capacity, conflict, or duplicate error
  /schedule/byes:
    get:
      operationId: listTeamByes
      tags: [schedule]
      summary: List visible bye weeks
      parameters:
        - name: teamId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: scheduleWeek
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Bye weeks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamBye" }
    post:
      operationId: createTeamBye
      tags: [schedule]
      summary: Create a manual bye
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamByeInput" }
      responses:
        "201":
          description: Bye created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamBye" }
    delete:
      operationId: deleteTeamBye
      tags: [schedule]
      parameters:
        - name: teamId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: scheduleWeek
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses: { "204": { description: Bye removed } }
  /schedule/byes/reconcile/preview:
    post:
      operationId: previewByeReconciliation
      tags: [schedule]
      summary: Preview reconciliation of the existing schedule
      responses:
        "200":
          description: Reconciliation preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ByeReconciliationPreview" }
  /schedule/byes/reconcile/commit:
    post:
      operationId: commitByeReconciliation
      tags: [schedule]
      summary: Commit a reviewed bye reconciliation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ByeReconciliationCommitInput" }
      responses:
        "200":
          description: Reconciliation committed or already present
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ByeReconciliationResult" }
        "409": { description: Reconciliation is stale or blocked }
  /schedule/{gameId}/publish:
    post:
      operationId: publishGame
      tags: [schedule]
      parameters: [{ $ref: "#/components/parameters/GameId" }]
      responses: { "204": { description: Game published } }
  /schedule/{gameId}/cancel:
    post:
      operationId: cancelGame
      tags: [schedule]
      parameters: [{ $ref: "#/components/parameters/GameId" }]
      responses: { "204": { description: Game cancelled } }
  /venues:
    get:
      operationId: listVenues
      tags: [schedule]
      responses:
        "200":
          description: Venues
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Venue" } }
    post:
      operationId: createVenue
      tags: [schedule]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/VenueInput" } },
          }
      responses:
        "201":
          description: Venue created
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Venue" } },
            }
  /venues/{venueId}:
    patch:
      operationId: updateVenue
      tags: [schedule]
      parameters: [{ $ref: "#/components/parameters/VenueId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/VenueUpdate" } },
          }
      responses:
        "200":
          description: Venue updated
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Venue" } },
            }
  /venues/{venueId}/courts:
    get:
      operationId: listCourts
      tags: [schedule]
      parameters: [{ $ref: "#/components/parameters/VenueId" }]
      responses:
        "200":
          description: Courts
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Court" } }
    post:
      operationId: createCourt
      tags: [schedule]
      parameters: [{ $ref: "#/components/parameters/VenueId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/CourtInput" } },
          }
      responses:
        "201":
          description: Court created
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Court" } },
            }
  /courts/{courtId}:
    patch:
      operationId: updateCourt
      tags: [schedule]
      parameters: [{ $ref: "#/components/parameters/CourtId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/CourtUpdate" } },
          }
      responses:
        "200":
          description: Court updated
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Court" } },
            }
  /standings:
    get:
      operationId: getStandings
      tags: [standings]
      responses:
        "200":
          description: Standings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Standing"
  /scores/{gameId}:
    post:
      operationId: submitScore
      tags: [scores]
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreInput"
      responses:
        "200":
          description: Score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Score"
    patch:
      operationId: correctScore
      tags: [scores]
      parameters: [{ $ref: "#/components/parameters/GameId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ScoreInput" } },
          }
      responses: { "204": { description: Score entered or corrected } }
  /scores/review:
    get:
      operationId: getScoreReviewQueue
      tags: [scores]
      responses:
        "200":
          description: Scores needing commissioner attention
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
  /scores/{gameId}/confirm:
    post:
      operationId: confirmScore
      tags: [scores]
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "204":
          description: Score finalized
  /scores/{gameId}/dispute:
    post:
      operationId: disputeScore
      tags: [scores]
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeInput"
      responses:
        "204":
          description: Score disputed
  /scores/{gameId}/resolve:
    post:
      operationId: resolveScore
      tags: [scores]
      parameters: [{ $ref: "#/components/parameters/GameId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ScoreInput" } },
          }
      responses: { "204": { description: Disputed score resolved } }
components:
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: integer }
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: integer }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: integer }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer }
    VenueId:
      name: venueId
      in: path
      required: true
      schema: { type: integer }
    CourtId:
      name: courtId
      in: path
      required: true
      schema: { type: integer }
    InvitationToken:
      name: token
      in: path
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Dashboard:
      type: object
      required:
        [
          leagueName,
          seasonName,
          role,
          nextGame,
          nextBye,
          attentionItems,
          recentResults,
        ]
      properties:
        leagueName: { type: string }
        seasonName: { type: string }
        role: { type: string, enum: [COMMISSIONER, CAPTAIN, PLAYER] }
        nextGame:
          anyOf:
            - $ref: "#/components/schemas/Game"
            - type: "null"
        nextBye:
          anyOf:
            - $ref: "#/components/schemas/TeamBye"
            - type: "null"
        attentionItems:
          type: array
          items: { type: string }
        recentResults:
          type: array
          items:
            $ref: "#/components/schemas/Game"
    LeagueInitializationStatus:
      type: object
      required: [requiresInitialization, hasActiveLeague, hasActiveSeason]
      properties:
        requiresInitialization: { type: boolean }
        hasActiveLeague: { type: boolean }
        hasActiveSeason: { type: boolean }
        leagueName: { type: ["string", "null"] }
    LeagueInitializationInput:
      type: object
      required: [leagueName, seasonName, startDate, endDate]
      properties:
        leagueName: { type: string, minLength: 1, maxLength: 160 }
        seasonName: { type: string, minLength: 1, maxLength: 160 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    LeagueInitializationResult:
      type: object
      required: [leagueId, seasonId, leagueName, seasonName]
      properties:
        leagueId: { type: integer }
        seasonId: { type: integer }
        leagueName: { type: string }
        seasonName: { type: string }
    UserProfile:
      type: object
      required: [id, firstName, lastName, phone, role, accessState]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string, pattern: '^\+[1-9]\d{1,14}$' }
        role: { type: string, enum: [COMMISSIONER, CAPTAIN, PLAYER] }
        accessState: { type: string, enum: [PENDING, ACTIVE, DISABLED] }
    ProfileInput:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
    CaptainInput:
      type: object
      required: [userId]
      properties: { userId: { type: integer } }
    ActiveInput:
      type: object
      required: [active]
      properties: { active: { type: boolean } }
    InvitationInput:
      type: object
      required: [phone]
      properties: { phone: { type: string, pattern: '^\+[1-9]\d{1,14}$' } }
    InvitationResult:
      type: object
      required: [id, expiresAt, token]
      properties:
        id: { type: integer }
        expiresAt: { type: string, format: date-time }
        token: { type: string }
    InvitationDetails:
      type: object
      required: [teamName, leagueName, membershipRole, expiresAt]
      properties:
        teamName: { type: string }
        leagueName: { type: string }
        membershipRole: { type: string, enum: [CAPTAIN, PLAYER] }
        expiresAt: { type: string, format: date-time }
    Team:
      type: object
      required: [id, name, captainName, playerCount, active]
      properties:
        id: { type: integer }
        name: { type: string }
        captainName: { type: string }
        playerCount: { type: integer }
        active: { type: boolean }
        canManageRoster: { type: boolean }
    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        captainId: { type: ["integer", "null"] }
    TeamUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        captainId: { type: ["integer", "null"] }
        active: { type: boolean }
    Venue:
      type: object
      required: [id, leagueId, name, address, active]
      properties:
        id: { type: integer }
        leagueId: { type: integer }
        name: { type: string }
        address: { type: string }
        active: { type: boolean }
    VenueInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string }
    VenueUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string }
        active: { type: boolean }
    Court:
      type: object
      required: [id, venueId, name, active]
      properties:
        id: { type: integer }
        venueId: { type: integer }
        name: { type: string }
        active: { type: boolean }
    CourtInput:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1 } }
    CourtUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        active: { type: boolean }
    GameInput:
      type: object
      required: [homeTeamId, awayTeamId, venueId, courtId, scheduledAt]
      properties:
        homeTeamId: { type: integer }
        awayTeamId: { type: integer }
        venueId: { type: integer }
        courtId: { type: integer }
        scheduledAt: { type: string, format: date-time }
    ScheduleGeneratorInput:
      type: object
      required: [format, venueId, courtIds, firstPlayDate, weekdays, timeSlots]
      properties:
        format: { type: string, enum: [SINGLE, DOUBLE] }
        venueId: { type: integer, minimum: 1 }
        courtIds:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1 }
        firstPlayDate: { type: string, format: date }
        weekdays:
          type: array
          minItems: 1
          items: { type: integer, minimum: 0, maximum: 6 }
        timeSlots:
          type: array
          minItems: 1
          items: { type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
        maxMatchesPerTeamPerDate:
          type: integer
          enum: [1, 2]
          default: 1
    ScheduleGeneratorCommitInput:
      allOf:
        - $ref: "#/components/schemas/ScheduleGeneratorInput"
        - type: object
          required: [confirm, previewHash]
          properties:
            confirm: { type: boolean, const: true }
            previewHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    ScheduleGeneratorGame:
      type: object
      required:
        [
          homeTeamId,
          awayTeamId,
          scheduledAt,
          courtId,
          date,
          time,
          round,
          scheduleWeek,
        ]
      properties:
        homeTeamId: { type: integer }
        awayTeamId: { type: integer }
        scheduledAt: { type: string, format: date-time }
        courtId: { type: integer }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        time: { type: string }
        round: { type: integer }
        scheduleWeek: { type: integer, minimum: 1 }
    ScheduleGeneratorPreview:
      type: object
      required:
        [
          format,
          teamCount,
          teamNames,
          totalMatches,
          previewHash,
          playDatesUsed,
          gamesPerTeam,
          homeAway,
          byes,
          games,
          warnings,
        ]
      properties:
        format: { type: string, enum: [SINGLE, DOUBLE] }
        previewHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        teamCount: { type: integer }
        teamNames:
          type: array
          items: { type: string }
        totalMatches: { type: integer }
        playDatesUsed:
          type: array
          items: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        gamesPerTeam:
          type: object
          additionalProperties: { type: integer }
        homeAway:
          type: object
          additionalProperties:
            type: object
            required: [home, away]
            properties:
              home: { type: integer }
              away: { type: integer }
        byes:
          type: array
          items:
            type: object
            required: [round, scheduleWeek, teamId, playDate]
            properties:
              round: { type: integer }
              scheduleWeek: { type: integer }
              teamId: { type: integer }
              playDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        games:
          type: array
          items: { $ref: "#/components/schemas/ScheduleGeneratorGame" }
        warnings:
          type: array
          items: { type: string }
    ScheduleGeneratorCommitResult:
      type: object
      required: [createdCount, noOp]
      properties:
        createdCount: { type: integer }
        noOp: { type: boolean }
    TeamBye:
      type: object
      required: [id, seasonId, teamId, teamName, scheduleWeek, playDate, source]
      properties:
        id: { type: integer }
        seasonId: { type: integer }
        teamId: { type: integer }
        teamName: { type: string }
        scheduleWeek: { type: integer, minimum: 1 }
        playDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        source: { type: string, enum: [GENERATED, RECONCILED, MANUAL] }
    TeamByeInput:
      type: object
      required: [teamId, scheduleWeek, playDate]
      properties:
        teamId: { type: integer, minimum: 1 }
        scheduleWeek: { type: integer, minimum: 1 }
        playDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
    ByeReconciliationWeek:
      type: object
      required: [scheduleWeek, playDate, games, byes, blockers]
      properties:
        scheduleWeek: { type: integer, minimum: 1 }
        playDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        games:
          type: array
          items: { $ref: "#/components/schemas/Game" }
        byes:
          type: array
          items:
            type: object
            required: [teamId, teamName, scheduleWeek, playDate]
            properties:
              teamId: { type: integer }
              teamName: { type: string }
              scheduleWeek: { type: integer }
              playDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        blockers:
          type: array
          items: { type: string }
    ByeReconciliationPreview:
      type: object
      required: [previewHash, canCommit, detectedFormat, weeks]
      properties:
        previewHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        canCommit: { type: boolean }
        detectedFormat:
          { type: ["string", "null"], enum: [SINGLE, DOUBLE, null] }
        weeks:
          type: array
          items: { $ref: "#/components/schemas/ByeReconciliationWeek" }
    ByeReconciliationCommitInput:
      type: object
      required: [confirm, previewHash]
      properties:
        confirm: { type: boolean, const: true }
        previewHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    ByeReconciliationResult:
      type: object
      required: [updatedGames, createdByes, noOp]
      properties:
        updatedGames: { type: integer }
        createdByes: { type: integer }
        noOp: { type: boolean }
    Player:
      type: object
      required: [id, firstName, lastName, status]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string, pattern: '^\+[1-9]\d{1,14}$' }
        status: { type: string, enum: [ACTIVE, PENDING] }
    Game:
      type: object
      required:
        [
          id,
          date,
          startTime,
          venue,
          court,
          homeTeam,
          awayTeam,
          status,
          published,
          scheduleWeek,
        ]
      properties:
        id: { type: integer }
        date: { type: string }
        startTime: { type: string }
        venue: { type: string }
        court: { type: string }
        homeTeam: { type: string }
        awayTeam: { type: string }
        homeTeamId: { type: integer }
        awayTeamId: { type: integer }
        venueId: { type: integer }
        courtId: { type: integer }
        scheduleWeek: { type: ["integer", "null"] }
        status:
          {
            type: string,
            enum: [SCHEDULED, CANCELLED, FINAL, PENDING_CONFIRMATION, DISPUTED],
          }
        published: { type: boolean }
        homeScore: { type: ["integer", "null"] }
        awayScore: { type: ["integer", "null"] }
        scoreSubmittedByCurrentUser: { type: boolean }
        disputeReason: { type: ["string", "null"] }
        canSubmitScore: { type: boolean }
        canConfirmOrDisputeScore: { type: boolean }
        canManageScore: { type: boolean }
    ScoreInput:
      type: object
      required: [homeScore, awayScore]
      properties:
        homeScore: { type: integer, minimum: 0 }
        awayScore: { type: integer, minimum: 0 }
    Score:
      type: object
      required: [gameId, homeScore, awayScore, status]
      properties:
        gameId: { type: integer }
        homeScore: { type: integer }
        awayScore: { type: integer }
        status:
          {
            type: string,
            enum: [NOT_SUBMITTED, PENDING_CONFIRMATION, DISPUTED, FINAL],
          }
    DisputeInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
    Standing:
      type: object
      required:
        [
          rank,
          teamName,
          played,
          wins,
          losses,
          pointsFor,
          pointsAgainst,
          differential,
        ]
      properties:
        rank: { type: integer }
        teamName: { type: string }
        played: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        pointsFor: { type: integer }
        pointsAgainst: { type: integer }
        differential: { type: integer }
